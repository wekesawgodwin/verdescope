<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Verde-Scope Africa Limited</title>
<meta name="description" content="Verde-Scope Africa Limited — environmental and sustainable development consultancy. Sustainable Solutions. Resilient Ecosystems. Thriving Communities.">
<link rel="icon" href="assets/img/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="contact">
<section class="page-head" style="background-image:url('assets/img/stock/hero-mara.jpg')"><div class="wrap">
  <span class="eyebrow">Verde-Scope Africa</span><h1 id="pageTitle">Contact Us</h1>
  <div class="crumbs"><a href="index.html">Home</a> / <span>Contact</span></div></div></section>

<section class="section"><div class="wrap contact-grid">
  <div class="reveal">
    <span class="eyebrow">Get in touch</span>
    <h2 style="font-size:clamp(28px,3vw,38px);font-weight:300">Let’s talk about your <b style="color:var(--accent);font-weight:500">project</b></h2>
    <div class="info-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div><div><h4>Office</h4><p id="cAddr"></p></div></div>
    <div class="info-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div><div><h4>Phone</h4><p id="cPhone"></p></div></div>
    <div class="info-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 7 9 6 9-6"/></svg></div><div><h4>Email</h4><p id="cMail"></p></div></div>
    <div class="info-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div><h4>Hours</h4><p>Monday – Friday, 8:00am – 5:00pm</p></div></div>
  </div>
  <div class="reveal">
    <form class="form" id="contactForm">
      <div class="field"><label for="name">Full name *</label><input id="name" name="name" required autocomplete="name"></div>
      <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" autocomplete="tel"></div>
      <div class="field"><label for="org">Organisation</label><input id="org" name="org" autocomplete="organization"></div>
      <div class="field full"><label for="service">Service of interest</label><select id="service" name="service"></select></div>
      <div class="field full"><label for="subject">Subject</label><input id="subject" name="subject"></div>
      <div class="field full"><label for="message">Message *</label><textarea id="message" name="message" required placeholder="Tell us about the project, location and timelines…"></textarea></div>
      <div class="full"><button class="btn solid" type="submit">Send inquiry</button></div>
      <div class="notice full" id="sent" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg><div><b>Thank you, your inquiry has been received.</b><br><span style="color:var(--muted)">Our team will respond by email within one business day.</span></div></div>
    </form>
  </div>
</div></section>
<iframe class="map" title="Office location map" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=36.8030%2C-1.2790%2C36.8190%2C-1.2650&amp;layer=mapnik&amp;marker=-1.2722%2C36.8108"></iframe>

<script src="assets/js/icons.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
